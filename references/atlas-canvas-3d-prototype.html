<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wormhole — Atlas Canvas 3D Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg-void: #080a0f;
    --bg-primary: #0f1117;
    --bg-surface: #1a1d27;
    --bg-elevated: #242836;
    --border: #2a2e3d;
    --text-primary: #e8e8ed;
    --text-secondary: #8a8da0;
    --text-muted: #555770;
    --accent: #4a9eff;
    --accent-glow: rgba(74, 158, 255, 0.25);
    --accent-dim: rgba(74, 158, 255, 0.08);
    --amber: #f5a623;
    --green: #4ade80;
    --danger: #ef4444;
    --kingdom-a: #4a9eff;
    --kingdom-b: #ef6b4a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: 'Instrument Sans', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    cursor: crosshair;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  canvas { display: block; }

  /* ─── HUD Layer ─────────────────────────────────────────── */

  .hud {
    position: fixed;
    z-index: 10;
    pointer-events: none;
  }

  .hud > * { pointer-events: auto; }

  /* Top bar */
  .hud-top {
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: linear-gradient(to bottom, rgba(8,10,15,0.85) 0%, transparent 100%);
  }

  .hud-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .hud-brand__icon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    box-shadow: 0 0 20px var(--accent-glow);
  }

  .hud-brand__text {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-primary);
  }

  .hud-brand__sub {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-left: 4px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
  }

  /* View mode indicator */
  .hud-view-mode {
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }

  .hud-view-mode__label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    padding: 6px 16px;
    background: var(--accent-dim);
    border: 1px solid rgba(74, 158, 255, 0.15);
    border-radius: 4px;
    transition: all 0.5s ease;
    white-space: nowrap;
  }

  .hud-view-mode__label[data-mode="tactical"] {
    color: var(--amber);
    background: rgba(245, 166, 35, 0.08);
    border-color: rgba(245, 166, 35, 0.15);
  }

  .hud-view-mode__label[data-mode="immersive"] {
    color: var(--green);
    background: rgba(74, 222, 128, 0.08);
    border-color: rgba(74, 222, 128, 0.15);
  }

  /* Right panel — zoom + info */
  .hud-right {
    top: 50%;
    right: 24px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 16px;
  }

  .zoom-track {
    width: 3px;
    height: 140px;
    background: var(--bg-elevated);
    border-radius: 2px;
    position: relative;
    border: 1px solid var(--border);
  }

  .zoom-fill {
    position: absolute;
    bottom: 0;
    left: -1px;
    right: -1px;
    background: var(--accent);
    border-radius: 2px;
    transition: height 0.2s ease;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .zoom-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    writing-mode: vertical-lr;
    text-orientation: mixed;
    transform: rotate(180deg);
    margin-top: 8px;
  }

  /* Bottom info */
  .hud-bottom {
    bottom: 0; left: 0; right: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 16px 24px;
    background: linear-gradient(to top, rgba(8,10,15,0.85) 0%, transparent 100%);
  }

  .hud-coords {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    gap: 16px;
  }

  .hud-coords span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .hud-coords .coord-label {
    color: var(--text-muted);
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .hud-legend {
    display: flex;
    gap: 20px;
    font-size: 11px;
  }

  .hud-legend__item {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
  }

  .hud-legend__dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* Instructions overlay */
  .hud-instructions {
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    transition: opacity 1s ease;
  }

  .hud-instructions__text {
    font-size: 12px;
    color: var(--text-muted);
    background: rgba(15, 17, 23, 0.8);
    padding: 8px 20px;
    border-radius: 20px;
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }

  .hud-instructions__text kbd {
    display: inline-block;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    margin: 0 2px;
  }

  .hud-instructions.hidden { opacity: 0; pointer-events: none; }

  /* Compass */
  .hud-compass {
    top: 80px;
    right: 24px;
    width: 48px;
    height: 48px;
  }

  .compass-ring {
    width: 48px;
    height: 48px;
    border: 1px solid var(--border);
    border-radius: 50%;
    position: relative;
    background: rgba(15, 17, 23, 0.6);
    backdrop-filter: blur(4px);
    transition: transform 0.15s ease;
  }

  .compass-needle {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 14px;
    background: var(--danger);
    border-radius: 1px;
  }

  .compass-needle::after {
    content: '';
    position: absolute;
    bottom: -14px;
    left: 0;
    width: 2px;
    height: 14px;
    background: var(--text-muted);
    border-radius: 1px;
  }

  .compass-n {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 700;
    color: var(--danger);
    letter-spacing: 1px;
  }

  /* Transition meter */
  .hud-transition {
    top: 50%;
    left: 24px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .transition-labels {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .transition-labels span {
    color: var(--text-muted);
    transition: color 0.3s;
  }

  .transition-labels span.active { color: var(--accent); }

  /* Vignette */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(8,10,15,0.6) 100%);
  }

  /* Scanline subtle effect */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.015) 2px,
      rgba(0,0,0,0.015) 4px
    );
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="vignette"></div>
<div class="scanlines"></div>

<!-- HUD -->
<div class="hud hud-top">
  <div class="hud-brand">
    <div class="hud-brand__icon">W</div>
    <span class="hud-brand__text">Wormhole</span>
    <span class="hud-brand__sub">Atlas Canvas</span>
  </div>
</div>

<div class="hud hud-view-mode">
  <div class="hud-view-mode__label" id="viewModeLabel" data-mode="strategic">Strategic View</div>
</div>

<div class="hud hud-compass">
  <div class="compass-ring" id="compassRing">
    <div class="compass-needle"></div>
    <span class="compass-n">N</span>
  </div>
</div>

<div class="hud hud-right">
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="zoom-label">ZOOM</span>
    <div class="zoom-track">
      <div class="zoom-fill" id="zoomFill"></div>
    </div>
  </div>
</div>

<div class="hud hud-transition">
  <div class="transition-labels">
    <span id="label3d">3D</span>
    <span id="labelTac">Tac</span>
    <span id="label2d" class="active">2D</span>
  </div>
</div>

<div class="hud hud-bottom">
  <div class="hud-coords">
    <span><span class="coord-label">Alt</span> <span id="coordAlt">120</span></span>
    <span><span class="coord-label">Pitch</span> <span id="coordPitch">2&deg;</span></span>
    <span><span class="coord-label">Terrain</span> <span id="coordTerrain">0%</span></span>
  </div>
  <div class="hud-legend">
    <div class="hud-legend__item">
      <div class="hud-legend__dot" style="background:var(--kingdom-a)"></div>
      Kingdom of Valdris
    </div>
    <div class="hud-legend__item">
      <div class="hud-legend__dot" style="background:var(--kingdom-b)"></div>
      Kingdom of Kyrath
    </div>
  </div>
</div>

<div class="hud hud-instructions" id="instructions">
  <div class="hud-instructions__text">
    <kbd>Scroll</kbd> to zoom &middot; <kbd>Left drag</kbd> to pan &middot; <kbd>Right drag</kbd> to rotate &middot; Watch the terrain rise as you zoom in
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Noise ────────────────────────────────────────────────────────

function hash(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 0xffffffff;
}

function smoothNoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx);
  const v = fy * fy * (3 - 2 * fy);
  return (hash(ix, iy) * (1 - u) + hash(ix + 1, iy) * u) * (1 - v)
       + (hash(ix, iy + 1) * (1 - u) + hash(ix + 1, iy + 1) * u) * v;
}

function fbm(x, y, octaves = 6) {
  let val = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) {
    val += amp * smoothNoise(x * freq, y * freq);
    amp *= 0.5; freq *= 2;
  }
  return val;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function smoothstep(t, a, b) { const x = Math.max(0, Math.min(1, (t - a) / (b - a))); return x * x * (3 - 2 * x); }

// ─── Config ──────────────────────────────────────────────────────

const TERRAIN_SIZE = 100;
const TERRAIN_RES = 150;
const MAX_HEIGHT = 8;
const WATER_LEVEL = 0.12;
const CAM_MIN_DIST = 12;
const CAM_MAX_DIST = 130;

// ─── Scene Setup ─────────────────────────────────────────────────

const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x080a0f);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080a0f, 0.0);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, CAM_MAX_DIST, 0.01);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = CAM_MIN_DIST;
controls.maxDistance = CAM_MAX_DIST;
controls.maxPolarAngle = Math.PI / 2.2;
controls.minPolarAngle = 0.05;
controls.target.set(0, 0, 0);
controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };

// ─── Lighting ────────────────────────────────────────────────────

const ambient = new THREE.AmbientLight(0x8899bb, 0.5);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x4a9eff, 0.15);
rim.position.set(-20, 30, -30);
scene.add(rim);

// ─── Terrain ─────────────────────────────────────────────────────

const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_RES - 1, TERRAIN_RES - 1);
terrainGeo.rotateX(-Math.PI / 2);

const positions = terrainGeo.attributes.position;
const baseHeights = new Float32Array(positions.count);
const colors = new Float32Array(positions.count * 3);

// Color ramp for terrain
function terrainColor(h) {
  if (h < WATER_LEVEL - 0.05) return [0.08, 0.18, 0.35];
  if (h < WATER_LEVEL)        return [0.12, 0.28, 0.48];
  if (h < WATER_LEVEL + 0.04) return [0.65, 0.6, 0.42];
  if (h < 0.35)               return [0.22, 0.42, 0.2];
  if (h < 0.55)               return [0.18, 0.32, 0.15];
  if (h < 0.72)               return [0.35, 0.33, 0.28];
  if (h < 0.85)               return [0.5, 0.48, 0.45];
  return [0.82, 0.82, 0.84];
}

// Central river valley — carves a depression along x=0
function riverCarve(x, z) {
  const dist = Math.abs(x) / (TERRAIN_SIZE / 2);
  const river = Math.exp(-dist * dist / 0.008) * 0.3;
  const meander = Math.sin(z * 0.15) * 2.5 + Math.sin(z * 0.07) * 4;
  const riverDist = Math.abs(x - meander) / (TERRAIN_SIZE / 2);
  return Math.exp(-riverDist * riverDist / 0.005) * 0.25;
}

for (let i = 0; i < positions.count; i++) {
  const x = positions.getX(i);
  const z = positions.getZ(i);

  const nx = x / TERRAIN_SIZE + 0.5;
  const nz = z / TERRAIN_SIZE + 0.5;

  let h = fbm(nx * 4 + 1.3, nz * 4 + 2.7, 6);
  // Edge falloff — keep edges low
  const edgeDist = Math.max(Math.abs(nx - 0.5), Math.abs(nz - 0.5)) * 2;
  const edgeFalloff = smoothstep(edgeDist, 0.7, 1.0);
  h *= (1 - edgeFalloff * 0.8);
  // River carve
  h -= riverCarve(x, z);
  h = Math.max(0, h);

  baseHeights[i] = h;

  // Add kingdom tint to vertex colors
  const [r, g, b] = terrainColor(h);
  const kingdomBlend = smoothstep(x / (TERRAIN_SIZE * 0.4), -0.5, 0.5);
  const tintA = [0.15, 0.35, 0.65]; // Valdris blue tint
  const tintB = [0.55, 0.25, 0.2];  // Kyrath red tint
  const tintStrength = (h > WATER_LEVEL && h < 0.55) ? 0.06 : 0;
  const tr = lerp(tintA[0], tintB[0], kingdomBlend) * tintStrength;
  const tg = lerp(tintA[1], tintB[1], kingdomBlend) * tintStrength;
  const tb = lerp(tintA[2], tintB[2], kingdomBlend) * tintStrength;

  colors[i * 3] = r + tr;
  colors[i * 3 + 1] = g + tg;
  colors[i * 3 + 2] = b + tb;
}

terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const terrainMat = new THREE.MeshLambertMaterial({
  vertexColors: true,
  flatShading: false,
});

const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);

// ─── Water ───────────────────────────────────────────────────────

const waterGeo = new THREE.PlaneGeometry(TERRAIN_SIZE * 1.2, TERRAIN_SIZE * 1.2, 1, 1);
waterGeo.rotateX(-Math.PI / 2);
const waterMat = new THREE.MeshPhongMaterial({
  color: 0x0a2040,
  transparent: true,
  opacity: 0.75,
  shininess: 80,
  specular: 0x4a9eff,
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = WATER_LEVEL * MAX_HEIGHT * 0.3;
scene.add(water);

// ─── Grid ────────────────────────────────────────────────────────

const gridHelper = new THREE.GridHelper(TERRAIN_SIZE, 20, 0x1a2a40, 0x111828);
gridHelper.position.y = 0.02;
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.4;
scene.add(gridHelper);

// ─── Settlements ─────────────────────────────────────────────────

const settlements = [
  // Valdris (west)
  { name: 'Valdris Keep', x: -22, z: -5, type: 'capital', kingdom: 'valdris' },
  { name: 'Thornwatch', x: -15, z: 12, type: 'town', kingdom: 'valdris' },
  { name: 'Silverdale', x: -28, z: -20, type: 'town', kingdom: 'valdris' },
  { name: "Pilgrim's Rest", x: -10, z: -18, type: 'landmark', kingdom: 'valdris' },
  // Kyrath (east)
  { name: 'Kyrath Citadel', x: 24, z: 2, type: 'capital', kingdom: 'kyrath' },
  { name: 'Ironhaven', x: 16, z: -14, type: 'town', kingdom: 'kyrath' },
  { name: 'Ashenmoor', x: 30, z: 18, type: 'town', kingdom: 'kyrath' },
  { name: 'The Spire', x: 18, z: 20, type: 'landmark', kingdom: 'kyrath' },
  // Neutral
  { name: 'Crosswind Bridge', x: 1, z: 2, type: 'landmark', kingdom: 'neutral' },
  { name: 'Sunken Temple', x: -5, z: 25, type: 'landmark', kingdom: 'neutral' },
];

const entityGroups = new THREE.Group();
scene.add(entityGroups);

const entityData = [];

settlements.forEach(s => {
  const group = new THREE.Group();
  group.position.set(s.x, 0, s.z);

  // 2D marker (always visible, fades at close zoom)
  const markerColor = s.kingdom === 'valdris' ? 0x4a9eff
    : s.kingdom === 'kyrath' ? 0xef6b4a : 0xf5a623;

  const dotSize = s.type === 'capital' ? 0.8 : s.type === 'town' ? 0.5 : 0.4;
  const dotGeo = new THREE.CircleGeometry(dotSize, 16);
  dotGeo.rotateX(-Math.PI / 2);
  const dotMat = new THREE.MeshBasicMaterial({ color: markerColor, side: THREE.DoubleSide });
  const dot = new THREE.Mesh(dotGeo, dotMat);
  dot.position.y = 0.1;
  group.add(dot);

  // Ring around dot
  const ringGeo = new THREE.RingGeometry(dotSize * 1.3, dotSize * 1.6, 24);
  ringGeo.rotateX(-Math.PI / 2);
  const ringMat = new THREE.MeshBasicMaterial({ color: markerColor, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.y = 0.08;
  group.add(ring);

  // Pulsing outer ring
  const pulseGeo = new THREE.RingGeometry(dotSize * 1.8, dotSize * 2.0, 24);
  pulseGeo.rotateX(-Math.PI / 2);
  const pulseMat = new THREE.MeshBasicMaterial({ color: markerColor, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
  const pulse = new THREE.Mesh(pulseGeo, pulseMat);
  pulse.position.y = 0.06;
  group.add(pulse);

  // 3D building (invisible at far zoom, appears at close zoom)
  const bldgGroup = new THREE.Group();
  if (s.type === 'capital') {
    // Castle: main block + tower
    const base = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 2.0, 1.8),
      new THREE.MeshLambertMaterial({ color: 0x555566 })
    );
    base.position.y = 1.0;
    base.castShadow = true;
    bldgGroup.add(base);
    const tower = new THREE.Mesh(
      new THREE.CylinderGeometry(0.35, 0.4, 2.5, 8),
      new THREE.MeshLambertMaterial({ color: 0x666677 })
    );
    tower.position.set(0.5, 2.5, 0.5);
    tower.castShadow = true;
    bldgGroup.add(tower);
    const spire = new THREE.Mesh(
      new THREE.ConeGeometry(0.5, 1.0, 8),
      new THREE.MeshLambertMaterial({ color: markerColor })
    );
    spire.position.set(0.5, 4.0, 0.5);
    bldgGroup.add(spire);
    // Flag
    const flagPole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03, 0.03, 1.5, 4),
      new THREE.MeshBasicMaterial({ color: 0x888888 })
    );
    flagPole.position.set(-0.5, 3.5, -0.5);
    bldgGroup.add(flagPole);
  } else if (s.type === 'town') {
    // House cluster
    for (let i = 0; i < 3; i++) {
      const hw = 0.4 + Math.random() * 0.3;
      const hh = 0.6 + Math.random() * 0.4;
      const house = new THREE.Mesh(
        new THREE.BoxGeometry(hw, hh, hw),
        new THREE.MeshLambertMaterial({ color: 0x554433 })
      );
      house.position.set((i - 1) * 0.7, hh / 2, (Math.random() - 0.5) * 0.6);
      house.castShadow = true;
      bldgGroup.add(house);
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(hw * 0.8, 0.4, 4),
        new THREE.MeshLambertMaterial({ color: 0x883322 })
      );
      roof.position.set(house.position.x, hh + 0.2, house.position.z);
      roof.rotation.y = Math.PI / 4;
      bldgGroup.add(roof);
    }
  } else {
    // Landmark: tall spire or ruin
    const pillar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.25, 3, 6),
      new THREE.MeshLambertMaterial({ color: 0x888877 })
    );
    pillar.position.y = 1.5;
    pillar.castShadow = true;
    bldgGroup.add(pillar);
    const crystal = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.35, 0),
      new THREE.MeshPhongMaterial({ color: markerColor, emissive: markerColor, emissiveIntensity: 0.3 })
    );
    crystal.position.y = 3.2;
    bldgGroup.add(crystal);
  }

  bldgGroup.visible = false;
  group.add(bldgGroup);

  // Label (canvas texture)
  const canvas2d = document.createElement('canvas');
  const ctx = canvas2d.getContext('2d');
  canvas2d.width = 256;
  canvas2d.height = 64;
  ctx.fillStyle = 'transparent';
  ctx.fillRect(0, 0, 256, 64);
  ctx.font = '600 22px Instrument Sans, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8e8ed';
  ctx.fillText(s.name, 128, 28);
  ctx.font = '500 14px JetBrains Mono, monospace';
  ctx.fillStyle = s.kingdom === 'valdris' ? '#4a9eff' : s.kingdom === 'kyrath' ? '#ef6b4a' : '#f5a623';
  const typeLabel = s.type === 'capital' ? 'CAPITAL' : s.type === 'town' ? 'TOWN' : 'LANDMARK';
  ctx.fillText(typeLabel, 128, 50);

  const labelTex = new THREE.CanvasTexture(canvas2d);
  const labelMat = new THREE.SpriteMaterial({ map: labelTex, transparent: true, depthWrite: false });
  const label = new THREE.Sprite(labelMat);
  label.scale.set(6, 1.5, 1);
  label.position.y = 2;
  label.renderOrder = 999;
  group.add(label);

  entityGroups.add(group);
  entityData.push({ group, dot, dotMat, ring, ringMat, pulse, pulseMat, bldgGroup, label, settlement: s, markerColor });
});

// ─── Roads ───────────────────────────────────────────────────────

const roadPaths = [
  ['Valdris Keep', 'Thornwatch'],
  ['Thornwatch', 'Crosswind Bridge'],
  ['Crosswind Bridge', 'Ironhaven'],
  ['Ironhaven', 'Kyrath Citadel'],
  ['Valdris Keep', 'Silverdale'],
  ['Kyrath Citadel', 'Ashenmoor'],
  ["Pilgrim's Rest", 'Valdris Keep'],
  ['Crosswind Bridge', 'Sunken Temple'],
  ['The Spire', 'Kyrath Citadel'],
];

const roadGroup = new THREE.Group();
scene.add(roadGroup);

roadPaths.forEach(([from, to]) => {
  const a = settlements.find(s => s.name === from);
  const b = settlements.find(s => s.name === to);
  if (!a || !b) return;

  const points = [];
  const segments = 20;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const x = lerp(a.x, b.x, t);
    const z = lerp(a.z, b.z, t);
    // Slight curve
    const perp = Math.sin(t * Math.PI) * 1.5;
    const dx = b.z - a.z, dz = -(b.x - a.x);
    const len = Math.sqrt(dx * dx + dz * dz) || 1;
    points.push(new THREE.Vector3(x + (dx / len) * perp * 0.3, 0.05, z + (dz / len) * perp * 0.3));
  }

  const roadGeo = new THREE.BufferGeometry().setFromPoints(points);
  const roadMat = new THREE.LineBasicMaterial({ color: 0x3a3a50, transparent: true, opacity: 0.6 });
  const road = new THREE.Line(roadGeo, roadMat);
  roadGroup.add(road);
});

// ─── Starfield background ────────────────────────────────────────

const starsGeo = new THREE.BufferGeometry();
const starPositions = new Float32Array(1500 * 3);
for (let i = 0; i < 1500; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 200;
  starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i * 3 + 1] = Math.abs(r * Math.cos(phi));
  starPositions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starsMat = new THREE.PointsMaterial({ color: 0x4466aa, size: 0.3, transparent: true, opacity: 0.6 });
const stars = new THREE.Points(starsGeo, starsMat);
scene.add(stars);

// ─── Border line between kingdoms ────────────────────────────────

const borderPoints = [];
for (let z = -TERRAIN_SIZE / 2; z <= TERRAIN_SIZE / 2; z += 1) {
  const meander = Math.sin(z * 0.15) * 2.5 + Math.sin(z * 0.07) * 4;
  borderPoints.push(new THREE.Vector3(meander, 0.15, z));
}
const borderGeo = new THREE.BufferGeometry().setFromPoints(borderPoints);
const borderMat = new THREE.LineDashedMaterial({
  color: 0xf5a623,
  transparent: true,
  opacity: 0.35,
  dashSize: 1.5,
  gapSize: 1,
});
const borderLine = new THREE.Line(borderGeo, borderMat);
borderLine.computeLineDistances();
scene.add(borderLine);

// ─── HUD Elements ────────────────────────────────────────────────

const viewModeLabel = document.getElementById('viewModeLabel');
const zoomFill = document.getElementById('zoomFill');
const compassRing = document.getElementById('compassRing');
const coordAlt = document.getElementById('coordAlt');
const coordPitch = document.getElementById('coordPitch');
const coordTerrain = document.getElementById('coordTerrain');
const label2d = document.getElementById('label2d');
const labelTac = document.getElementById('labelTac');
const label3d = document.getElementById('label3d');
const instructionsEl = document.getElementById('instructions');

let instructionsTimer = setTimeout(() => instructionsEl.classList.add('hidden'), 6000);

// ─── Animation Loop ──────────────────────────────────────────────

let currentTerrainScale = 0;

function getTransitionFactor() {
  const dist = camera.position.distanceTo(controls.target);
  return 1 - Math.max(0, Math.min(1, (dist - CAM_MIN_DIST) / (CAM_MAX_DIST - CAM_MIN_DIST)));
}

function animate(time) {
  requestAnimationFrame(animate);
  controls.update();

  const t = getTransitionFactor(); // 0 = far/2D, 1 = close/3D
  const targetTerrainScale = smoothstep(t, 0.1, 0.6);

  // Smooth terrain transition
  currentTerrainScale += (targetTerrainScale - currentTerrainScale) * 0.05;

  // Update terrain vertex heights
  const pos = terrainGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setY(i, baseHeights[i] * currentTerrainScale * MAX_HEIGHT);
  }
  pos.needsUpdate = true;
  terrainGeo.computeVertexNormals();

  // Water level
  water.position.y = WATER_LEVEL * currentTerrainScale * MAX_HEIGHT * 0.85;
  water.material.opacity = lerp(0.3, 0.75, currentTerrainScale);

  // Grid opacity (fade out as terrain rises)
  gridHelper.material.opacity = lerp(0.4, 0.0, smoothstep(t, 0.2, 0.5));

  // Fog
  scene.fog.density = lerp(0.0, 0.012, smoothstep(t, 0.4, 0.9));

  // Stars fade
  starsMat.opacity = lerp(0.6, 0.0, smoothstep(t, 0.3, 0.6));

  // Border line rise
  const bpos = borderGeo.attributes.position;
  for (let i = 0; i < bpos.count; i++) {
    const bx = bpos.getX(i);
    const bz = bpos.getZ(i);
    const nx = bx / TERRAIN_SIZE + 0.5;
    const nz = bz / TERRAIN_SIZE + 0.5;
    let h = fbm(nx * 4 + 1.3, nz * 4 + 2.7, 6);
    h -= riverCarve(bx, bz);
    h = Math.max(0, h);
    bpos.setY(i, h * currentTerrainScale * MAX_HEIGHT + 0.15);
  }
  bpos.needsUpdate = true;

  // Entities
  const entityShowBuildings = smoothstep(t, 0.35, 0.65);
  const entityShowMarkers = 1 - smoothstep(t, 0.45, 0.7);
  const labelScale = lerp(6, 3, smoothstep(t, 0.2, 0.6));

  entityData.forEach(({ group, dot, dotMat, ring, ringMat, pulse, pulseMat, bldgGroup, label, settlement: s }) => {
    // Get terrain height at entity position
    const nx = s.x / TERRAIN_SIZE + 0.5;
    const nz = s.z / TERRAIN_SIZE + 0.5;
    let h = fbm(nx * 4 + 1.3, nz * 4 + 2.7, 6);
    h -= riverCarve(s.x, s.z);
    h = Math.max(0, h);
    group.position.y = h * currentTerrainScale * MAX_HEIGHT;

    // Markers
    dot.visible = entityShowMarkers > 0.01;
    ring.visible = entityShowMarkers > 0.01;
    pulse.visible = entityShowMarkers > 0.01;
    dotMat.opacity = entityShowMarkers;
    dotMat.transparent = true;
    ringMat.opacity = entityShowMarkers * 0.3;
    pulseMat.opacity = entityShowMarkers * 0.15;

    // Pulse animation
    const pulseScale = 1 + Math.sin(time * 0.002 + s.x) * 0.15;
    pulse.scale.set(pulseScale, 1, pulseScale);

    // Buildings
    bldgGroup.visible = entityShowBuildings > 0.01;
    bldgGroup.scale.setScalar(entityShowBuildings);

    // Labels
    label.material.opacity = Math.max(entityShowMarkers, entityShowBuildings > 0.5 ? 1 : 0);
    label.scale.set(labelScale, labelScale * 0.25, 1);
    label.position.y = lerp(1.5, s.type === 'capital' ? 5.5 : s.type === 'town' ? 3 : 4, entityShowBuildings);
  });

  // Roads rise with terrain
  roadGroup.children.forEach(road => {
    const rpos = road.geometry.attributes.position;
    for (let i = 0; i < rpos.count; i++) {
      const rx = rpos.getX(i);
      const rz = rpos.getZ(i);
      const nx = rx / TERRAIN_SIZE + 0.5;
      const nz = rz / TERRAIN_SIZE + 0.5;
      let h = fbm(nx * 4 + 1.3, nz * 4 + 2.7, 6);
      h -= riverCarve(rx, rz);
      h = Math.max(0, h);
      rpos.setY(i, h * currentTerrainScale * MAX_HEIGHT + 0.08);
    }
    rpos.needsUpdate = true;
    road.material.opacity = lerp(0.5, 0.8, smoothstep(t, 0.2, 0.5));
  });

  // ─── Auto-tilt camera toward perspective at close zoom ─────────
  const targetPolar = lerp(0.08, 1.05, smoothstep(t, 0.15, 0.7));
  const currentPolar = controls.getPolarAngle();
  if (Math.abs(currentPolar - targetPolar) > 0.01) {
    const newPolar = currentPolar + (targetPolar - currentPolar) * 0.03;
    controls.minPolarAngle = Math.min(newPolar, targetPolar);
    controls.maxPolarAngle = Math.max(newPolar, Math.PI / 2.2);
  }

  // ─── HUD Updates ───────────────────────────────────────────────

  const dist = camera.position.distanceTo(controls.target);
  const zoomPct = Math.round(t * 100);
  zoomFill.style.height = `${zoomPct}%`;

  // View mode
  let mode, modeText;
  if (t < 0.3) { mode = 'strategic'; modeText = 'Strategic View'; }
  else if (t < 0.65) { mode = 'tactical'; modeText = 'Tactical View'; }
  else { mode = 'immersive'; modeText = 'Immersive View'; }
  viewModeLabel.dataset.mode = mode;
  viewModeLabel.textContent = modeText;

  // Transition labels
  label2d.className = t < 0.3 ? 'active' : '';
  labelTac.className = (t >= 0.3 && t < 0.65) ? 'active' : '';
  label3d.className = t >= 0.65 ? 'active' : '';

  // Compass
  const azimuth = controls.getAzimuthalAngle() * (180 / Math.PI);
  compassRing.style.transform = `rotate(${azimuth}deg)`;

  // Coords
  coordAlt.textContent = Math.round(dist);
  const pitchDeg = Math.round(controls.getPolarAngle() * (180 / Math.PI));
  coordPitch.innerHTML = `${pitchDeg}&deg;`;
  coordTerrain.textContent = `${Math.round(currentTerrainScale * 100)}%`;

  renderer.render(scene, camera);
}

animate(0);

// ─── Resize ──────────────────────────────────────────────────────

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Dismiss instructions on first interaction
['wheel', 'mousedown', 'touchstart'].forEach(evt => {
  window.addEventListener(evt, () => {
    clearTimeout(instructionsTimer);
    instructionsEl.classList.add('hidden');
  }, { once: true });
});
</script>

</body>
</html>
