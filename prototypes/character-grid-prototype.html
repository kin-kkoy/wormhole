<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wormhole — Character Grid Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0c0c16;
    color: #d4d4e0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Top Controls ── */
  .top-controls {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(12,12,22,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
    z-index: 40;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 3px;
    background: rgba(255,255,255,0.03);
    border-radius: 7px;
    padding: 2px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .ctrl-group button {
    padding: 5px 14px;
    border: none;
    border-radius: 5px;
    font-size: 0.68rem;
    font-weight: 500;
    font-family: 'Inter', system-ui, sans-serif;
    cursor: pointer;
    color: #555;
    background: transparent;
    letter-spacing: 0.3px;
    transition: all 0.15s;
  }
  .ctrl-group button.active {
    background: rgba(100,100,180,0.15);
    color: #aaa;
  }
  .ctrl-label {
    font-size: 0.58rem;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
    padding: 0 6px;
  }

  /* ── Main Area ── */
  .main-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* ── The Card ── */
  .character-card {
    width: 80%;
    max-width: 1100px;
    height: calc(100vh - 84px - 40px);
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 16px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
  }
  .character-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, #4a7199 0%, #3b5f8a 35%, #2e4d6e 100%);
    z-index: 0;
  }
  .character-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(255,255,255,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 100%, rgba(0,0,0,0.12) 0%, transparent 50%);
    z-index: 1;
    pointer-events: none;
  }

  .card-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 14px;
  }

  /* ── Card Header ── */
  .card-header {
    display: flex;
    gap: 16px;
    flex-shrink: 0;
  }
  .header-image {
    width: 130px;
    height: 130px;
    background: linear-gradient(135deg, #5a6a7a, #4a5868);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.15);
    border: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
    overflow: hidden;
  }
  .header-image .img-ph {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .header-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: center;
  }
  .header-name {
    background: linear-gradient(135deg, #5cb85c, #4aa84a);
    padding: 8px 16px;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(92,184,92,0.2);
  }
  .header-name h1 {
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .header-ribbon {
    height: 2px;
    background: linear-gradient(90deg, #8b6bb5, #5b8db5, transparent);
    opacity: 0.5;
    border-radius: 1px;
  }
  .header-details {
    background: rgba(0,0,0,0.15);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hd-item {
    display: flex;
    gap: 6px;
    align-items: baseline;
  }
  .hd-key {
    font-size: 0.58rem;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .hd-val {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.65);
  }

  /* ── Grid Area ── */
  .grid-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    background: rgba(0,0,0,0.1);
    border: 1px solid rgba(255,255,255,0.05);
  }

  .block-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 1fr;
    gap: 8px;
    padding: 10px;
    height: 100%;
  }

  /* Grid lines visible in edit mode */
  body.mode-edit .grid-area {
    background:
      rgba(0,0,0,0.1);
  }
  body.mode-edit .grid-area::before {
    content: '';
    position: absolute;
    inset: 10px;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: calc(33.333% - 5.33px) calc(20% - 6.4px);
    z-index: 0;
    pointer-events: none;
    border-radius: 6px;
  }

  /* ── Grid Block ── */
  .grid-block {
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .grid-block:hover {
    border-color: rgba(255,255,255,0.12);
  }

  /* Span classes */
  .col-1 { grid-column: span 1; }
  .col-2 { grid-column: span 2; }
  .col-3 { grid-column: span 3; }
  .row-1 { grid-row: span 1; }
  .row-2 { grid-row: span 2; }

  .block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px;
    background: rgba(0,0,0,0.12);
    flex-shrink: 0;
  }
  .block-title {
    font-size: 0.6rem;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 0.7px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .block-drag {
    color: rgba(255,255,255,0.12);
    font-size: 0.7rem;
    cursor: grab;
  }
  .block-drag:active { cursor: grabbing; }
  .grid-block:hover .block-drag { color: rgba(255,255,255,0.25); }

  .block-actions {
    display: flex;
    gap: 2px;
  }
  .block-actions button {
    background: none;
    border: none;
    color: rgba(255,255,255,0.12);
    cursor: pointer;
    font-size: 0.7rem;
    padding: 2px 4px;
    border-radius: 3px;
    line-height: 1;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .block-actions button:hover { color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.05); }
  .block-actions .btn-delete:hover { color: #d55; background: rgba(200,60,60,0.1); }

  .block-body {
    flex: 1;
    overflow: hidden;
    display: flex;
  }
  .block-body textarea {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.85);
    font-family: 'Lora', Georgia, serif;
    font-size: 0.78rem;
    line-height: 1.65;
    padding: 8px 10px;
    resize: none;
    outline: none;
  }
  .block-body textarea::selection { background: rgba(255,255,255,0.12); }

  /* ── View mode block body ── */
  .block-view {
    flex: 1;
    overflow: hidden;
    padding: 8px 10px;
    font-family: 'Lora', Georgia, serif;
    font-size: 0.78rem;
    line-height: 1.7;
    color: rgba(255,255,255,0.8);
    display: none;
  }
  .block-view ul { list-style: none; padding: 0; margin: 0; }
  .block-view li {
    padding: 1px 0 1px 12px;
    position: relative;
    color: rgba(255,255,255,0.7);
  }
  .block-view li::before {
    content: '';
    position: absolute;
    left: 0; top: 9px;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }
  .block-view p { margin: 2px 0; color: rgba(255,255,255,0.7); }
  .block-view .wh-link {
    color: #7abfff;
    text-decoration: none;
    border-bottom: 1px solid rgba(122,191,255,0.2);
    cursor: pointer;
  }
  .block-view .wh-link:hover { border-bottom-color: rgba(122,191,255,0.5); }

  /* ── Edit mode: show edit UI, hide view ── */
  body.mode-edit .block-body { display: flex; }
  body.mode-edit .block-view { display: none; }
  body.mode-edit .block-actions { display: flex; }
  body.mode-edit .block-drag { display: inline; }

  /* ── View mode: hide edit UI, show view ── */
  body.mode-view .block-body { display: none; }
  body.mode-view .block-view { display: block; }
  body.mode-view .block-actions { display: none; }
  body.mode-view .block-drag { display: none; }
  body.mode-view .grid-area::before { display: none; }

  /* ── Dock / Palette (edit mode only) ── */
  .dock {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(20, 20, 36, 0.95);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 30;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
    width: 140px;
    transition: opacity 0.2s, transform 0.2s;
  }
  body.mode-view .dock { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(20px); }

  .dock-title {
    font-size: 0.58rem;
    font-weight: 600;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 2px 4px;
    margin-bottom: 2px;
  }

  .dock-item {
    padding: 7px 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    font-size: 0.68rem;
    font-weight: 500;
    color: rgba(255,255,255,0.45);
    cursor: grab;
    transition: all 0.15s;
    user-select: none;
  }
  .dock-item:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.65);
  }
  .dock-item:active { cursor: grabbing; transform: scale(0.97); }
  .dock-item.dragging { opacity: 0.3; }

  .dock-divider {
    height: 1px;
    background: rgba(255,255,255,0.05);
    margin: 2px 0;
  }

  .dock-custom {
    padding: 7px 10px;
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.08);
    border-radius: 8px;
    font-size: 0.68rem;
    font-weight: 500;
    color: rgba(255,255,255,0.25);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .dock-custom:hover {
    border-color: rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.45);
  }

  /* ── Grid drop target highlight ── */
  .grid-drop-indicator {
    position: absolute;
    background: rgba(92,184,92,0.1);
    border: 2px dashed rgba(92,184,92,0.3);
    border-radius: 8px;
    pointer-events: none;
    z-index: 5;
    display: none;
    transition: all 0.1s;
  }

  /* ── Size controls on selected block ── */
  .grid-block.selected {
    border-color: rgba(122,191,255,0.3);
    box-shadow: 0 0 0 2px rgba(122,191,255,0.08);
  }
  .size-controls {
    display: none;
    position: absolute;
    bottom: 4px;
    right: 4px;
    gap: 2px;
    z-index: 3;
  }
  .grid-block.selected .size-controls { display: flex; }
  .size-btn {
    width: 22px;
    height: 22px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 4px;
    color: rgba(255,255,255,0.5);
    font-size: 0.6rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 600;
  }
  .size-btn:hover { background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.8); }

  /* ── Modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: linear-gradient(155deg, #3a5a7a, #2e4a64);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 22px;
    width: 300px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .modal h3 { font-size: 0.82rem; font-weight: 600; margin-bottom: 14px; color: rgba(255,255,255,0.65); }
  .modal input[type="text"] {
    width: 100%; padding: 10px 12px;
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; color: #ddd;
    font-size: 0.8rem; font-family: 'Inter', system-ui, sans-serif;
    outline: none;
  }
  .modal input:focus { border-color: rgba(255,255,255,0.2); }
  .modal input::placeholder { color: rgba(255,255,255,0.2); }
  .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .modal-btns button {
    padding: 7px 16px; border-radius: 8px; border: none;
    font-size: 0.75rem; font-weight: 500; cursor: pointer;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .btn-cancel { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.35); }
  .btn-confirm { background: #5cb85c; color: #fff; }
  .btn-confirm:hover { background: #5abf5e; }

  /* ── Empty grid message ── */
  .grid-empty-msg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.12);
    font-size: 0.75rem;
    pointer-events: none;
    z-index: 0;
  }
</style>
</head>
<body class="mode-edit">

<div class="top-controls">
  <div class="ctrl-group">
    <span class="ctrl-label">Mode</span>
    <button class="active" onclick="setMode('edit',this)">Edit</button>
    <button onclick="setMode('view',this)">View</button>
  </div>
</div>

<div class="main-area">

  <div class="character-card">
    <div class="card-content">

      <!-- Header -->
      <div class="card-header">
        <div class="header-image"><span class="img-ph">Image</span></div>
        <div class="header-info">
          <div class="header-name"><h1>Captain Voss</h1></div>
          <div class="header-ribbon"></div>
          <div class="header-details">
            <div class="hd-item"><span class="hd-key">Title</span><span class="hd-val">Fleet Commander</span></div>
            <div class="hd-item"><span class="hd-key">Born</span><span class="hd-val">Year 412, Ashenmoor</span></div>
            <div class="hd-item"><span class="hd-key">Status</span><span class="hd-val">Active</span></div>
          </div>
        </div>
      </div>

      <!-- Grid -->
      <div class="grid-area" id="gridArea">
        <div class="block-grid" id="blockGrid">

          <!-- Row 1: full-width Relationships -->
          <div class="grid-block col-3 row-1" data-col="3" data-row="1" onclick="selectBlock(this)">
            <div class="block-header">
              <span class="block-title"><span class="block-drag">&#9776;</span>Relationships</span>
              <div class="block-actions">
                <button onclick="cycleCol(event)" title="Change width">W</button>
                <button onclick="cycleRow(event)" title="Change height">H</button>
                <button class="btn-delete" onclick="deleteBlock(event)">&times;</button>
              </div>
            </div>
            <div class="block-body"><textarea>- [[Kira]] — Rival turned ally after the siege of Dawnport
- [[Marcus]] — Mentor, killed in Act 2 defending the Breach
- [[Admiral Thane]] — Former commanding officer, now estranged
- [[Sera]] — First mate, fiercely loyal</textarea></div>
            <div class="block-view"></div>
            <div class="size-controls">
              <button class="size-btn" onclick="cycleCol(event)" title="Cycle width">W</button>
              <button class="size-btn" onclick="cycleRow(event)" title="Cycle height">H</button>
            </div>
          </div>

          <!-- Row 2: Personality (2-col) + Powers (1-col) -->
          <div class="grid-block col-2 row-1" data-col="2" data-row="1" onclick="selectBlock(this)">
            <div class="block-header">
              <span class="block-title"><span class="block-drag">&#9776;</span>Personality</span>
              <div class="block-actions">
                <button onclick="cycleCol(event)" title="Change width">W</button>
                <button onclick="cycleRow(event)" title="Change height">H</button>
                <button class="btn-delete" onclick="deleteBlock(event)">&times;</button>
              </div>
            </div>
            <div class="block-body"><textarea>Cold and calculated on the surface, but fiercely protective of her crew. Speaks in short, clipped sentences when stressed.

Has a habit of tapping her ring finger on hard surfaces — a leftover from years wearing a navigator's ring she no longer carries.</textarea></div>
            <div class="block-view"></div>
            <div class="size-controls">
              <button class="size-btn" onclick="cycleCol(event)" title="Cycle width">W</button>
              <button class="size-btn" onclick="cycleRow(event)" title="Cycle height">H</button>
            </div>
          </div>

          <div class="grid-block col-1 row-1" data-col="1" data-row="1" onclick="selectBlock(this)">
            <div class="block-header">
              <span class="block-title"><span class="block-drag">&#9776;</span>Powers</span>
              <div class="block-actions">
                <button onclick="cycleCol(event)" title="Change width">W</button>
                <button onclick="cycleRow(event)" title="Change height">H</button>
                <button class="btn-delete" onclick="deleteBlock(event)">&times;</button>
              </div>
            </div>
            <div class="block-body"><textarea>- Void Navigation
- Tactical genius
- Old Ashenmoor dialect</textarea></div>
            <div class="block-view"></div>
            <div class="size-controls">
              <button class="size-btn" onclick="cycleCol(event)" title="Cycle width">W</button>
              <button class="size-btn" onclick="cycleRow(event)" title="Cycle height">H</button>
            </div>
          </div>

          <!-- Row 3: Arc Notes (2-col) + Secrets (1-col) -->
          <div class="grid-block col-2 row-1" data-col="2" data-row="1" onclick="selectBlock(this)">
            <div class="block-header">
              <span class="block-title"><span class="block-drag">&#9776;</span>Arc Notes</span>
              <div class="block-actions">
                <button onclick="cycleCol(event)" title="Change width">W</button>
                <button onclick="cycleRow(event)" title="Change height">H</button>
                <button class="btn-delete" onclick="deleteBlock(event)">&times;</button>
              </div>
            </div>
            <div class="block-body"><textarea>- Act 1: Antagonist pursuing the protagonist through the Shattered Straits
- Act 2: Reluctant alliance after the Breach opens
- Act 3: Sacrifice at the Breach — "Someone has to hold the line."</textarea></div>
            <div class="block-view"></div>
            <div class="size-controls">
              <button class="size-btn" onclick="cycleCol(event)" title="Cycle width">W</button>
              <button class="size-btn" onclick="cycleRow(event)" title="Cycle height">H</button>
            </div>
          </div>

          <div class="grid-block col-1 row-1" data-col="1" data-row="1" onclick="selectBlock(this)">
            <div class="block-header">
              <span class="block-title"><span class="block-drag">&#9776;</span>Secrets</span>
              <div class="block-actions">
                <button onclick="cycleCol(event)" title="Change width">W</button>
                <button onclick="cycleRow(event)" title="Change height">H</button>
                <button class="btn-delete" onclick="deleteBlock(event)">&times;</button>
              </div>
            </div>
            <div class="block-body"><textarea>- Knows the true cause of the Ashenmoor Collapse
- Carries an unopened letter from Marcus</textarea></div>
            <div class="block-view"></div>
            <div class="size-controls">
              <button class="size-btn" onclick="cycleCol(event)" title="Cycle width">W</button>
              <button class="size-btn" onclick="cycleRow(event)" title="Cycle height">H</button>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Dock -->
  <div class="dock" id="dock">
    <div class="dock-title">Blocks</div>
    <div class="dock-item" draggable="true" data-name="Relationships">Relationships</div>
    <div class="dock-item" draggable="true" data-name="Personality">Personality</div>
    <div class="dock-item" draggable="true" data-name="Arc Notes">Arc Notes</div>
    <div class="dock-item" draggable="true" data-name="Powers">Powers</div>
    <div class="dock-item" draggable="true" data-name="Secrets">Secrets</div>
    <div class="dock-item" draggable="true" data-name="Backstory">Backstory</div>
    <div class="dock-item" draggable="true" data-name="Quotes">Quotes</div>
    <div class="dock-item" draggable="true" data-name="Inventory">Inventory</div>
    <div class="dock-divider"></div>
    <div class="dock-custom" onclick="openCustomModal()">+ Custom</div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="customModal">
  <div class="modal">
    <h3>Custom Block</h3>
    <input type="text" id="customBlockName" placeholder="Block name..." />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeCustomModal()">Cancel</button>
      <button class="btn-confirm" onclick="addCustomBlock()">Add</button>
    </div>
  </div>
</div>

<script>
  /* ── Mode ── */
  function setMode(mode, btn) {
    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.className = 'mode-' + mode;
    if (mode === 'view') renderAllViews();
    deselectAll();
  }

  /* ── Render ── */
  function renderInline(text) {
    text = text.replace(/\[\[([^\]]+)\]\]/g, '<span class="wh-link">$1</span>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return text;
  }

  function renderMarkdown(raw) {
    const lines = raw.split('\n');
    let html = '', inList = false;
    for (const line of lines) {
      const t = line.trim();
      if (!t) { if (inList) { html += '</ul>'; inList = false; } continue; }
      if (t.startsWith('- ')) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + renderInline(t.slice(2)) + '</li>';
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<p>' + renderInline(t) + '</p>';
      }
    }
    if (inList) html += '</ul>';
    return html;
  }

  function renderAllViews() {
    document.querySelectorAll('.grid-block').forEach(block => {
      const ta = block.querySelector('textarea');
      const view = block.querySelector('.block-view');
      if (ta && view) view.innerHTML = renderMarkdown(ta.value);
    });
  }

  /* ── Block Selection ── */
  function selectBlock(block) {
    if (!document.body.classList.contains('mode-edit')) return;
    deselectAll();
    block.classList.add('selected');
  }
  function deselectAll() {
    document.querySelectorAll('.grid-block.selected').forEach(b => b.classList.remove('selected'));
  }
  document.addEventListener('click', e => {
    if (!e.target.closest('.grid-block') && !e.target.closest('.size-controls')) deselectAll();
  });

  /* ── Size Controls ── */
  function cycleCol(e) {
    e.stopPropagation();
    const block = e.target.closest('.grid-block');
    let col = parseInt(block.dataset.col) || 1;
    col = col >= 3 ? 1 : col + 1;
    block.dataset.col = col;
    block.classList.remove('col-1','col-2','col-3');
    block.classList.add('col-' + col);
  }
  function cycleRow(e) {
    e.stopPropagation();
    const block = e.target.closest('.grid-block');
    let row = parseInt(block.dataset.row) || 1;
    row = row >= 2 ? 1 : row + 1;
    block.dataset.row = row;
    block.classList.remove('row-1','row-2');
    block.classList.add('row-' + row);
  }

  function deleteBlock(e) {
    e.stopPropagation();
    const block = e.target.closest('.grid-block');
    block.style.transition = 'opacity 0.15s, transform 0.15s';
    block.style.opacity = '0';
    block.style.transform = 'scale(0.95)';
    setTimeout(() => block.remove(), 150);
  }

  /* ── Dock Drag ── */
  let dragName = null;

  document.querySelectorAll('.dock-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      dragName = item.dataset.name;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', item.dataset.name);
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      dragName = null;
    });
  });

  const gridArea = document.getElementById('gridArea');
  const blockGrid = document.getElementById('blockGrid');

  gridArea.addEventListener('dragover', e => {
    e.preventDefault();
    if (dragName) e.dataTransfer.dropEffect = 'copy';
  });

  gridArea.addEventListener('drop', e => {
    e.preventDefault();
    if (!dragName) return;
    addBlockToGrid(dragName);
    dragName = null;
  });

  function addBlockToGrid(name) {
    const block = document.createElement('div');
    block.className = 'grid-block col-1 row-1';
    block.dataset.col = '1';
    block.dataset.row = '1';
    block.setAttribute('onclick', 'selectBlock(this)');
    block.innerHTML = `
      <div class="block-header">
        <span class="block-title"><span class="block-drag">&#9776;</span>${name}</span>
        <div class="block-actions">
          <button onclick="cycleCol(event)" title="Change width">W</button>
          <button onclick="cycleRow(event)" title="Change height">H</button>
          <button class="btn-delete" onclick="deleteBlock(event)">&times;</button>
        </div>
      </div>
      <div class="block-body"><textarea placeholder="Write about ${name.toLowerCase()}..."></textarea></div>
      <div class="block-view"></div>
      <div class="size-controls">
        <button class="size-btn" onclick="cycleCol(event)" title="Cycle width">W</button>
        <button class="size-btn" onclick="cycleRow(event)" title="Cycle height">H</button>
      </div>
    `;
    blockGrid.appendChild(block);

    block.style.opacity = '0';
    block.style.transform = 'scale(0.95)';
    block.style.transition = 'opacity 0.2s, transform 0.2s';
    requestAnimationFrame(() => { block.style.opacity = '1'; block.style.transform = 'none'; });
    setTimeout(() => { const ta = block.querySelector('textarea'); if (ta) ta.focus(); }, 150);
  }

  /* ── Custom Block Modal ── */
  function openCustomModal() {
    document.getElementById('customModal').classList.add('active');
    const input = document.getElementById('customBlockName');
    input.value = '';
    setTimeout(() => input.focus(), 100);
  }
  function closeCustomModal() { document.getElementById('customModal').classList.remove('active'); }
  function addCustomBlock() {
    const name = document.getElementById('customBlockName').value.trim();
    if (!name) return;
    addBlockToGrid(name);
    closeCustomModal();
  }
  document.getElementById('customBlockName').addEventListener('keydown', e => {
    if (e.key === 'Enter') addCustomBlock();
    if (e.key === 'Escape') closeCustomModal();
  });
  document.getElementById('customModal').addEventListener('click', e => {
    if (e.target === document.getElementById('customModal')) closeCustomModal();
  });
</script>

</body>
</html>
